name: schedule-lab
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate samples
        run: python tools/generate_samples.py --huge
      - name: Build and tests (Linux)
        if: runner.os != 'Windows'
        run: bash ./gradlew --no-daemon clean build :app:installDist
      - name: Build and tests (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat --no-daemon clean build :app:installDist
      - name: Compare CLI output
        run: python tools/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.os }}
          path: |
            app/build/reports/tests/test
            app/build/test-results/test
            verification
